events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        client_max_body_size 10M;
        resolver 127.0.0.11 ipv6=off valid=30s;

        # CORS for ALL responses - apply to everything
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        add_header 'Access-Control-Max-Age' 86400 always;

        # AUTH - exact location for /auth to prevent redirect
        location = /auth {
            if ($request_method = 'OPTIONS') { return 204; }
            return 301 /auth/;
        }
        location /auth/ {
            if ($request_method = 'OPTIONS') { return 204; }
            set $upstream auth_service;
            proxy_pass http://$upstream:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Catch-all to core API - handles ALL other routes
        location / {
            # OPTIONS - handle directly without redirect
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            
            set $upstream core_api;
            proxy_pass http://$upstream:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}