events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Reusable CORS header map — allows localhost dev origins
    map $http_origin $cors_origin {
        default                    "";
        "http://localhost:5173"    "http://localhost:5173";
        "http://127.0.0.1:5173"   "http://127.0.0.1:5173";
        "http://localhost:3000"    "http://localhost:3000";
        "http://127.0.0.1:3000"   "http://127.0.0.1:3000";
    }

    server {
        listen 80;
        client_max_body_size 10M;
        resolver 127.0.0.11 ipv6=off valid=30s;

        # AUTH - exact location for /auth to prevent redirect
        location = /auth {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'      $cors_origin always;
                add_header 'Access-Control-Allow-Credentials' 'true'        always;
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept' always;
                add_header 'Access-Control-Max-Age'           '86400'       always;
                return 204;
            }
            return 301 /auth/;
        }

        location /auth/ {
            # Preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'      $cors_origin always;
                add_header 'Access-Control-Allow-Credentials' 'true'        always;
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept' always;
                add_header 'Access-Control-Max-Age'           '86400'       always;
                return 204;
            }

            # Actual request — inject CORS headers on every response
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'        always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept' always;

            set $upstream auth_service;
            proxy_pass http://$upstream:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Catch-all to core API
        location / {
            # Preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'      $cors_origin always;
                add_header 'Access-Control-Allow-Credentials' 'true'        always;
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept' always;
                add_header 'Access-Control-Max-Age'           '86400'       always;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'        always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept' always;

            set $upstream core_api;
            proxy_pass http://$upstream:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}